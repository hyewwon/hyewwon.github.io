<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Hyewwon 포트폴리오로 이동</title>
    <link rel="canonical" href="https://hyewwon.github.io/" />
    <script>
      // Preserve old bookmarks, query parameters and anchors without adding
      // another history entry. File previews still resolve to index.html.
      const destination = new URL('index.html', window.location.href);
      if (destination.protocol !== 'file:') {
        destination.pathname = destination.pathname.replace(/index\.html$/, '');
      }
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=index.html" /></noscript>
  </head>
  <body>
    <p><a href="index.html">김혜원의 포트폴리오 열기</a></p>
  </body>
</html>
