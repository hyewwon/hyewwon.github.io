<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="김혜원 포트폴리오의 지상에서 물속으로 이어지는 스플래시 장면 컨셉"
    />
    <title>Splash Scene Concept | Hyewwon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/splash-concept.css?v=copy-progress-2" />
  </head>
  <body class="is-intro-playing">
    <a class="skip-link" href="#splash-title">인사말로 바로가기</a>

    <header class="scene-header" data-scene-header>
      <a class="scene-brand" href="splash-concept.html" aria-label="스플래시 컨셉 홈">
        <span class="scene-brand__mark" aria-hidden="true"></span>
        Kim Hyewwon
      </a>
      <div class="scene-header__meta">
        <span data-scene-label>Intro · Loading</span>
        <button class="guide-toggle" type="button" data-replay-intro hidden>
          Intro replay
        </button>
      </div>
    </header>

    <main>
      <section
        class="splash-scroll"
        data-splash-scroll
        aria-label="포트폴리오를 여는 스플래시 애니메이션"
        aria-live="polite"
      >
        <div class="splash-scene" data-splash-scene>
          <div class="surface-world" aria-hidden="true">
            <div class="surface-world__glow"></div>
            <span class="cloud cloud--one"></span>
            <span class="cloud cloud--two"></span>
          </div>

          <div class="splash-copy">
            <p class="splash-copy__eyebrow">KIM HYEWWON · BACKEND DEVELOPER</p>
            <h1 id="splash-title">
              BEYOND<br />
              THE SURFACE.
            </h1>
            <p class="splash-copy__body">Dive into my work.</p>
            <strong class="splash-copy__progress" data-splash-progress>0%</strong>
          </div>

          <svg
            class="cliff"
            viewBox="0 0 700 260"
            preserveAspectRatio="none"
            role="img"
            aria-label="연못가로 완만하게 이어지는 낮고 평평한 둔덕"
          >
            <path
              class="cliff__soil"
              d="M0 54h516c35 0 62 13 75 37 12 22 7 46-12 68-24 27-48 54-58 101H0V54Z"
            />
            <path
              class="cliff__soil-shade"
              d="M0 201h532c-5 17-9 36-11 59H0v-59Z"
            />
            <path
              class="cliff__top"
              d="M0 54h516c35 0 62 13 75 37"
            />
            <path class="cliff__strata" d="M24 132h268m-248 61h326" />
            <path class="cliff__detail" d="M476 53c1-11 5-19 11-26m7 26c6-14 13-22 21-28m-54 28c-8-8-14-13-21-16" />
          </svg>

          <div class="splash-frog" data-splash-frog>
            <div
              class="splash-frog__sprite"
              data-splash-frog-sprite
              role="img"
              aria-label="연못가 둔덕에서 인사한 뒤 물속으로 뛰어드는 초록색 개구리"
            ></div>
          </div>

          <div class="entry-splash" data-entry-splash aria-hidden="true">
            <span class="entry-splash__ring entry-splash__ring--one"></span>
            <span class="entry-splash__ring entry-splash__ring--two"></span>
            <span class="entry-splash__drop entry-splash__drop--one"></span>
            <span class="entry-splash__drop entry-splash__drop--two"></span>
          </div>

          <div class="pond-lilies" aria-hidden="true">
              <span class="lily-pad lily-pad--one">
                <svg viewBox="0 0 96 48" aria-hidden="true">
                  <path class="lily-pad__leaf" d="M48 24 67 4C83 8 94 18 94 28c0 11-19 18-46 18S2 39 2 28 21 8 40 5l8 19Z" />
                  <path class="lily-pad__vein" d="M48 24 18 29m30-5 29 10m-29-10-2 18" />
                </svg>
              </span>
              <span class="lily-pad lily-pad--two">
                <svg viewBox="0 0 96 48" aria-hidden="true">
                  <path class="lily-pad__leaf" d="M48 24 67 4C83 8 94 18 94 28c0 11-19 18-46 18S2 39 2 28 21 8 40 5l8 19Z" />
                  <path class="lily-pad__vein" d="M48 24 18 29m30-5 29 10m-29-10-2 18" />
                </svg>
              </span>
              <span class="lily-pad lily-pad--three">
                <svg viewBox="0 0 96 48" aria-hidden="true">
                  <path class="lily-pad__leaf" d="M48 24 67 4C83 8 94 18 94 28c0 11-19 18-46 18S2 39 2 28 21 8 40 5l8 19Z" />
                  <path class="lily-pad__vein" d="M48 24 18 29m30-5 29 10m-29-10-2 18" />
                </svg>
              </span>
          </div>

          <div class="underwater-curtain" aria-hidden="true">
            <div class="water-surface">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="light-ray light-ray--one"></div>
            <div class="light-ray light-ray--two"></div>
            <div class="light-ray light-ray--three"></div>
            <span class="water-bubble water-bubble--one"></span>
            <span class="water-bubble water-bubble--two"></span>
            <span class="water-bubble water-bubble--three"></span>
          </div>

          <div class="scroll-cue" aria-hidden="true">
            <span data-splash-status>연못을 준비하고 있습니다</span>
            <i></i>
          </div>

          <div class="scene-grain" aria-hidden="true"></div>
        </div>
      </section>

      <section class="concept-notes" data-portfolio-content aria-labelledby="concept-notes-title">
        <div>
          <p class="concept-notes__eyebrow">Kim Hyewwon · Portfolio 2026</p>
          <h2 id="concept-notes-title">물속에서 이어지는<br />김혜원의 이야기.</h2>
        </div>
        <dl>
          <div>
            <dt>01 · About</dt>
            <dd>문제를 이해하고 구조를 설계하는 방식</dd>
          </div>
          <div>
            <dt>02 · Work</dt>
            <dd>서비스를 만들고 운영하며 쌓은 경험</dd>
          </div>
          <div>
            <dt>03 · Projects</dt>
            <dd>기술적 판단과 해결 과정을 담은 프로젝트</dd>
          </div>
        </dl>
      </section>
    </main>

    <script src="assets/js/splash-concept.js?v=copy-progress-1"></script>
  </body>
</html>
