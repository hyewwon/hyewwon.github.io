<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="작은 픽셀 마을을 탐험하며 확인하는 백엔드 개발자 김혜원의 인터랙티브 포트폴리오"
    />
    <title>Kim Hyewwon | Portfolio Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/index.css" />
  </head>
  <body>
    <a class="skip-link" href="#portfolio-panel">포트폴리오 정보로 이동</a>

    <main class="village-app" aria-label="Kim Hyewwon portfolio village">
      <canvas id="world-canvas" aria-label="포트폴리오 마을 지도"></canvas>

      <section class="hud top-hud" aria-label="current portfolio status">
        <div class="brand-card">
          <span class="brand-pixel">H</span>
          <div>
            <p>Portfolio Village</p>
            <h1>Kim Hyewwon</h1>
          </div>
        </div>
        <div class="status-card">
          <span id="current-place">마을 입구</span>
          <strong id="interaction-hint">건물 앞에서 Enter</strong>
        </div>
      </section>

      <aside class="hud map-card" aria-label="quick travel">
        <p class="hud-title">Quick Travel</p>
        <button type="button" data-travel="home">Home</button>
        <button type="button" data-travel="server">Server Room</button>
        <button type="button" data-travel="lab">AI Lab</button>
        <button type="button" data-travel="workshop">Projects</button>
        <button type="button" data-travel="library">Experience</button>
        <button type="button" data-travel="mail">Contact</button>
      </aside>

      <section class="hud guide-card" aria-label="controls">
        <p class="hud-title">Controls</p>
        <div><kbd>WASD</kbd>/<kbd>←↑↓→</kbd> 이동</div>
        <div><kbd>Enter</kbd> 장소 열기</div>
        <div><kbd>Esc</kbd> 닫기</div>
      </section>

      <section class="mobile-controls" aria-label="mobile controls">
        <div class="dpad" aria-label="movement controls">
          <button type="button" data-move="up">↑</button>
          <button type="button" data-move="left">←</button>
          <button type="button" data-move="down">↓</button>
          <button type="button" data-move="right">→</button>
        </div>
        <button class="interact-button" type="button" data-interact>Open</button>
      </section>

      <section
        id="portfolio-panel"
        class="portfolio-panel"
        aria-live="polite"
        aria-hidden="true"
      >
        <button class="panel-close" type="button" aria-label="패널 닫기">×</button>
        <p class="panel-kicker" id="panel-kicker">Village Stop</p>
        <h2 id="panel-title">Portfolio</h2>
        <div id="panel-body" class="panel-body"></div>
      </section>
    </main>

    <script src="assets/js/index.js?v=village2" defer></script>
  </body>
</html>
